[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-toolbox"
version = "1.1.0"
description = "Cyber Threat Intelligence - Toolbox for indicator extraction, defanging, and threat intel lookups"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joerg Stephan"},
]
keywords = ["cyber-threat-intelligence", "threat-intel", "ioc", "defang", "alienvault", "xforce", "virustotal", "misp", "stix"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
feeds = ["feedparser>=6.0.0"]
env = ["python-dotenv>=1.0.0"]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cti = "cti_toolbox.cli:main"
redactit = "cti_toolbox.defang.redact:main"
indifetch = "cti_toolbox.extract.indicators:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cti_toolbox*"]
